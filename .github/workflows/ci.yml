name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format, Compile, Test & Assets
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore Mix cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies and esbuild
        run: |
          mix deps.get
          mix assets.setup

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run ExUnit test suite
        run: mix test

      - name: Check browser JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/native_file.js
          node --check assets/js/rotation_guides.js
          node --check assets/js/self_loops.js

      - name: Build static assets
        run: mix assets.build
